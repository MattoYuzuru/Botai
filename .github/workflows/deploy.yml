name: deploy

# Runs after a green CI on main (or by hand). One build at a time: a newer main commit waits
# instead of cancelling the running build, and GitHub keeps only the newest pending run.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnostics:
        description: "Подробная диагностика: сохранить режим / включить / выключить"
        type: choice
        options: ["keep", "on", "off"]
        default: "keep"
  # Build-only check when the image definition itself changes (agents' PRs are not affected).
  pull_request:
    paths: [ops/docker/**, ops/compose.prod.yaml, .github/workflows/deploy.yml, .dockerignore]

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mattoyuzuru/botai-app
  SANDBOX_IMAGE: ghcr.io/mattoyuzuru/botai-sandbox

jobs:
  candidate:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.verify.outputs.eligible }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = pull_request ]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$sha" != "$current" ]; then
            echo 'Skipping superseded deployment candidate'
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=50" \
            --jq ".workflow_runs | map(select(.head_sha == \"$sha\")) | sort_by(.run_number) | last | .conclusion")
          [ "$conclusion" = success ] || { echo 'Current main must pass CI before deployment'; exit 1; }
          echo 'eligible=true' >> "$GITHUB_OUTPUT"

  build:
    needs: candidate
    if: needs.candidate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - id: tag
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/app.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/MattoYuzuru/Botai
            org.opencontainers.image.revision=${{ needs.candidate.outputs.sha }}

      # The v4 agent code sandbox is a separate image (docs/v4/13-executor.md §5): the worker pulls
      # it by the same commit tag and starts sibling containers from it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/sandbox.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.SANDBOX_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.SANDBOX_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/MattoYuzuru/Botai
            org.opencontainers.image.revision=${{ needs.candidate.outputs.sha }}

  deploy:
    needs: [candidate, build]
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - name: Refuse a superseded rollout
        env:
          EXPECTED_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          [ "$EXPECTED_SHA" = "$current" ] || { echo 'Main changed during build; newer rollout will follow'; exit 1; }
      - name: SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload compose and deploy script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          scp -i ~/.ssh/id_deploy -o BatchMode=yes ops/compose.prod.yaml ops/deploy/remote-deploy.sh \
            "botai-deploy@${DEPLOY_HOST}:/srv/botai/"
      - name: Deploy ${{ needs.build.outputs.tag }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAG: ${{ needs.build.outputs.tag }}
          REVISION: ${{ needs.candidate.outputs.sha }}
          DIAGNOSTICS: ${{ inputs.diagnostics || 'keep' }}
        run: |
          case "$DIAGNOSTICS" in keep|on|off) ;; *) exit 64 ;; esac
          printf '%s\n%s\n%s\n%s\n%s\n' "${{ github.actor }}" "$GHCR_TOKEN" "$DEEPSEEK_API_KEY" "$EXA_API_KEY" "$GROQ_API_KEY" |
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes "botai-deploy@${DEPLOY_HOST}" \
              "bash /srv/botai/remote-deploy.sh ${TAG} ${DIAGNOSTICS} ${REVISION}"
