name: deploy

# Runs after a green CI on main (or by hand). One build at a time: a newer main commit waits
# instead of cancelling the running build, and GitHub keeps only the newest pending run.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # Build-only check when the image definition itself changes (agents' PRs are not affected).
  pull_request:
    paths: [ops/docker/**, ops/compose.prod.yaml, .github/workflows/deploy.yml, .dockerignore]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mattoyuzuru/botai-app

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: tag
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/app.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: org.opencontainers.image.source=https://github.com/MattoYuzuru/Botai

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload compose and deploy script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          scp -i ~/.ssh/id_deploy -o BatchMode=yes ops/compose.prod.yaml ops/deploy/remote-deploy.sh \
            "botai-deploy@${DEPLOY_HOST}:/srv/botai/"
      - name: Deploy ${{ needs.build.outputs.tag }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          printf '%s\n%s\n%s\n' "${{ github.actor }}" "$GHCR_TOKEN" "$DEEPSEEK_API_KEY" |
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes "botai-deploy@${DEPLOY_HOST}" \
              "bash /srv/botai/remote-deploy.sh ${TAG}"
