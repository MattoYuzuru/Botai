<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f9fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1115" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="BotAI — учебный хаб студента: расписание, сроки и ответы агента из ваших вузов." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico?v=3" type="image/x-icon" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon-varya-v3-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-varya-v3.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/varya-v3-apple-touch-180.png" sizes="180x180" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BotAI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>BotAI</title>
    <script>
      // До первой отрисовки: сохранённая тема и спокойный режим, чтобы страница не мигала.
      try {
        const theme = localStorage.getItem("botai.theme");
        if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
        if (localStorage.getItem("botai.motion") === "calm") document.documentElement.setAttribute("data-motion", "calm");
      } catch {
        // хранилище недоступно — остаются системные настройки
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
