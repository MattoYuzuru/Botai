# Production stack on mnema (docs/plan/deployment.md). Compose project: botai.
# One host port only: 127.0.0.1:18090 (Caddy → api). Never touch the mnema-prod project.
# Secrets live in /srv/botai/app.secrets (0600, botai-deploy) and are never baked into images.
name: botai

x-app: &app
  image: ghcr.io/mattoyuzuru/botai-app:${IMAGE_TAG:?IMAGE_TAG is required}
  env_file: [/srv/botai/app.secrets]
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://botai:${POSTGRES_PASSWORD:?}@postgres:5432/botai
    EGRESS_PROXY_URL: http://proxy:3128
    ENV: prod
    BOTAI_ENV: prod
    PUBLIC_BASE_URL: https://botai.mnema.app
    LLM_PROVIDER: deepseek
    LLM_DEBUG_TRACES: "false"
    SEARCH_MODE: "${SEARCH_MODE:-auto}"
    SEARCH_DEADLINE_S: "${SEARCH_DEADLINE_S:-15}"
    SEARCH_MAX_CALLS: "${SEARCH_MAX_CALLS:-4}"
    SEARCH_MAX_COST_USD: "${SEARCH_MAX_COST_USD:-0.03}"
    SEARCH_COOLDOWN_S: "${SEARCH_COOLDOWN_S:-60}"
    # Dictation (docs/development/speech-to-text.md). Its key is NOT in app.secrets: only the api reads
    # /srv/botai/speech.secrets (services.api.env_file), not the worker, the proxy or the migration.
    STT_PROVIDER: "${STT_PROVIDER:-groq}"
    STT_MODEL: "${STT_MODEL:-whisper-large-v3-turbo}"
    STT_LANGUAGE: "${STT_LANGUAGE:-ru}"
    STT_DEADLINE_S: "${STT_DEADLINE_S:-45}"
    STT_REQUESTS_PER_HOUR: "${STT_REQUESTS_PER_HOUR:-60}"
    STT_SECONDS_PER_DAY: "${STT_SECONDS_PER_DAY:-7200}"
    BOTAI_DIAGNOSTICS: "${BOTAI_DIAGNOSTICS:-false}"
    BOTAI_DIAGNOSTICS_DIR: /var/log/botai/diagnostics
    BOTAI_DIAGNOSTICS_RETENTION_HOURS: "${BOTAI_DIAGNOSTICS_RETENTION_HOURS:-24}"
    BOTAI_DIAGNOSTICS_MAX_BYTES: "${BOTAI_DIAGNOSTICS_MAX_BYTES:-10485760}"
    BOTAI_DIAGNOSTICS_BACKUP_COUNT: "${BOTAI_DIAGNOSTICS_BACKUP_COUNT:-2}"
    BOTAI_RESEARCH_SLICE_SECONDS: "${BOTAI_RESEARCH_SLICE_SECONDS:-90}"
    BOTAI_RESEARCH_SLICE_STEPS: "${BOTAI_RESEARCH_SLICE_STEPS:-10}"
    BOTAI_RESEARCH_MAX_SECONDS: "${BOTAI_RESEARCH_MAX_SECONDS:-1800}"
    BOTAI_RESEARCH_MAX_TOKENS: "${BOTAI_RESEARCH_MAX_TOKENS:-1500000}"
    BOTAI_RESEARCH_MAX_STEPS: "${BOTAI_RESEARCH_MAX_STEPS:-100}"
    BOTAI_RESEARCH_MAX_REQUESTS: "${BOTAI_RESEARCH_MAX_REQUESTS:-2000}"
    BOTAI_RESEARCH_CHECKPOINT_TTL_HOURS: "${BOTAI_RESEARCH_CHECKPOINT_TTL_HOURS:-24}"
    # --- v4 free-harness engine (docs/v4/README.md, 05-implementation-plan.md) ----------------
    # v3 stays the default until the owner accepts v4; switch by adding BOTAI_AGENT_ENGINE=v4 to
    # /srv/botai/compose.vars and running a normal deploy (docs/plan/deployment.md).
    BOTAI_AGENT_ENGINE: "${BOTAI_AGENT_ENGINE:-v3}"
    # In production agent code runs only in the Docker sandbox: LocalExecutor is a loud config
    # error there (docs/v4/13-executor.md §2, §5). The sandbox image is built by CI per commit.
    BOTAI_AGENT_EXECUTOR: "container"
    BOTAI_AGENT_WORKSPACE_ROOT: /srv/botai/agent-workspaces
    BOTAI_SOURCE_ARTIFACTS_DIR: /srv/botai/source-artifacts
    BOTAI_SANDBOX_IMAGE: "ghcr.io/mattoyuzuru/botai-sandbox:${IMAGE_TAG:?IMAGE_TAG is required}"
    BOTAI_AGENT_HARD_STOP_USD: "${BOTAI_AGENT_HARD_STOP_USD:-2.0}"
    BOTAI_AGENT_AUTO_CONTINUE: "${BOTAI_AGENT_AUTO_CONTINUE:-false}"
    # Soft per-task limits of the v4 engine (D-009): visible counters, not walls; the owner can
    # raise them in compose.vars. Production gets finite defaults so one task cannot burn forever.
    BOTAI_AGENT_LIMITS_STEPS: "${BOTAI_AGENT_LIMITS_STEPS:-100}"
    BOTAI_AGENT_LIMITS_SECONDS: "${BOTAI_AGENT_LIMITS_SECONDS:-1800}"
    BOTAI_AGENT_LIMITS_TOKENS: "${BOTAI_AGENT_LIMITS_TOKENS:-3000000}"
    BOTAI_AGENT_LIMITS_USD: "${BOTAI_AGENT_LIMITS_USD:-0.30}"
    # RAG (docs/v4/18-rag.md): on in production, local offline embeddings by default (no key);
    # the owner switches to an API provider with BOTAI_RAG_* + BOTAI_EMBEDDING_API_KEY in
    # compose.vars/secrets. The artifact root is the same persistent host dir as sources.
    BOTAI_RAG_ENABLED: "${BOTAI_RAG_ENABLED:-true}"
    BOTAI_RAG_PROVIDER: "${BOTAI_RAG_PROVIDER:-local}"
    BOTAI_RAG_DIMENSION: "${BOTAI_RAG_DIMENSION:-384}"
    BOTAI_RAG_ARTIFACT_ROOT: /srv/botai/source-artifacts
  volumes: [diagdata:/var/log/botai/diagnostics]
  restart: unless-stopped
  networks: [botai]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    # pgvector on purpose (docs/v4/18-rag.md §3, D-011): the RAG migration creates the `vector`
    # extension. Same PG 17 major as the previous postgres:17-alpine, so the pgdata volume is reused
    # without initdb; the base image changes musl->glibc, so after the first deploy on this image
    # check `datcollversion`/warnings and refresh the collation version + reindex if PG reports it
    # (docs/plan/deployment.md, «pgvector: образ Postgres и collation»).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: botai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: botai
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botai"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [botai]
    mem_limit: 768m

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    profiles: [tools]

  api:
    <<: *app
    env_file: [/srv/botai/app.secrets, /srv/botai/speech.secrets]
    environment:
      <<: *app-env
      BOTAI_DIAGNOSTICS_SERVICE: api
    # The framework spools an upload above a megabyte (attachments, dictation) to /tmp: into memory
    # (counted in mem_limit), never onto the disk layer of the container. The API also runs inline
    # v4 source syncs (REST «Перечитать»), and a browser-format playbook starts Chromium there, so
    # /tmp and memory must fit one short headless browser — not only uploads. (Architecture debt:
    # heavy browser syncs should move to the worker/job queue in the next iteration; documented in
    # docs/v4/16-sources-runner-tools.md.)
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 1gb
    ports: ["127.0.0.1:18090:8000"]
    # The API also runs v4 source syncs (parser code + optional browser) for the REST path, so it
    # gets the same sandbox capability as the worker: docker CLI + the host socket, and the two
    # persistent host dirs bind-mounted at the SAME absolute paths. The sandbox container itself
    # never receives the socket or the app secrets (ContainerExecutor passes only explicit env).
    volumes:
      - diagdata:/var/log/botai/diagnostics
      - /srv/botai/agent-workspaces:/srv/botai/agent-workspaces
      - /srv/botai/source-artifacts:/srv/botai/source-artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    group_add: ["${DOCKER_GID:?DOCKER_GID is required: run ops/deploy/bootstrap-server.sh}"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 768m

  worker:
    <<: *app
    command: ["python", "-m", "botai.worker"]
    # Worker drains for 20 seconds before returning its claims to the queue.
    stop_grace_period: 45s
    environment:
      <<: *app-env
      BOTAI_DIAGNOSTICS_SERVICE: worker
      BOTAI_BROWSER_TMPDIR: /tmp/chromium  # browser profiles live in tmpfs, never on disk
    tmpfs:
      - /tmp:size=512m,mode=1777
    # v4 agent code sandbox: sibling Docker containers on the host daemon (docs/v4/13-executor.md).
    # The workspace/artifact host dirs are mounted at identical paths because the sandbox container
    # bind-mounts the very same absolute workspace path off the host.
    volumes:
      - diagdata:/var/log/botai/diagnostics
      - /srv/botai/agent-workspaces:/srv/botai/agent-workspaces
      - /srv/botai/source-artifacts:/srv/botai/source-artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    group_add: ["${DOCKER_GID:?DOCKER_GID is required: run ops/deploy/bootstrap-server.sh}"]
    depends_on:
      postgres: { condition: service_healthy }
      proxy: { condition: service_started }
    shm_size: 1gb
    mem_limit: 2g

  proxy:
    <<: *app
    command: ["python", "-m", "botai.browser.proxy", "--listen", "0.0.0.0:3128"]
    environment:
      <<: *app-env
      BOTAI_DIAGNOSTICS_SERVICE: proxy
      # Groq refuses the server's country: the proxy reaches api.groq.com only through `relay`.
      BOTAI_EGRESS_RELAY: "${BOTAI_EGRESS_RELAY:-api.groq.com=relay:18443}"
    mem_limit: 256m

  # An SSH forward to api.groq.com:443 through the owner's server abroad (docs/plan/deployment.md,
  # «Выход к Groq»). The remote account may open that one host and nothing else; the key and the
  # pinned host key live in /srv/botai/relay. Reachable only inside the stack's network.
  relay:
    <<: *app
    env_file: []
    environment:
      RELAY_TARGET: "${RELAY_TARGET:-botai-egress@2.27.23.184}"
    command:
      - sh
      - -c
      - >-
        exec ssh -NT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        -o UserKnownHostsFile=/run/relay/known_hosts -o GlobalKnownHostsFile=/dev/null
        -o ExitOnForwardFailure=yes -o ConnectTimeout=10 -o ServerAliveInterval=15
        -o ServerAliveCountMax=2 -i /run/relay/id_ed25519
        -L 0.0.0.0:18443:api.groq.com:443 "$$RELAY_TARGET"
    volumes:
      - /srv/botai/relay:/run/relay:ro
    depends_on: {}
    restart: unless-stopped
    mem_limit: 64m

volumes:
  pgdata: {}
  diagdata: {}

networks:
  botai: {}
