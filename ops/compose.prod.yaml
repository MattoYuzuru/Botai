# Production stack on mnema (docs/plan/deployment.md). Compose project: botai.
# One host port only: 127.0.0.1:18090 (Caddy → api). Never touch the mnema-prod project.
# Secrets live in /srv/botai/app.secrets (0600, botai-deploy) and are never baked into images.
name: botai

x-app: &app
  image: ghcr.io/mattoyuzuru/botai-app:${IMAGE_TAG:?IMAGE_TAG is required}
  env_file: [/srv/botai/app.secrets]
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://botai:${POSTGRES_PASSWORD:?}@postgres:5432/botai
    EGRESS_PROXY_URL: http://proxy:3128
    ENV: prod
    BOTAI_ENV: prod
    PUBLIC_BASE_URL: https://botai.mnema.app
    LLM_PROVIDER: deepseek
    LLM_DEBUG_TRACES: "false"
    SEARCH_MODE: "${SEARCH_MODE:-auto}"
    SEARCH_DEADLINE_S: "${SEARCH_DEADLINE_S:-15}"
    SEARCH_MAX_CALLS: "${SEARCH_MAX_CALLS:-4}"
    SEARCH_MAX_COST_USD: "${SEARCH_MAX_COST_USD:-0.03}"
    SEARCH_COOLDOWN_S: "${SEARCH_COOLDOWN_S:-60}"
    # Dictation (docs/development/speech-to-text.md). Its key is NOT in app.secrets: only the api reads
    # /srv/botai/speech.secrets (services.api.env_file), not the worker, the proxy or the migration.
    STT_PROVIDER: "${STT_PROVIDER:-groq}"
    STT_MODEL: "${STT_MODEL:-whisper-large-v3-turbo}"
    STT_LANGUAGE: "${STT_LANGUAGE:-ru}"
    STT_DEADLINE_S: "${STT_DEADLINE_S:-45}"
    STT_REQUESTS_PER_HOUR: "${STT_REQUESTS_PER_HOUR:-60}"
    STT_SECONDS_PER_DAY: "${STT_SECONDS_PER_DAY:-7200}"
    BOTAI_DIAGNOSTICS: "${BOTAI_DIAGNOSTICS:-false}"
    BOTAI_DIAGNOSTICS_DIR: /var/log/botai/diagnostics
    BOTAI_DIAGNOSTICS_RETENTION_HOURS: "${BOTAI_DIAGNOSTICS_RETENTION_HOURS:-24}"
    BOTAI_DIAGNOSTICS_MAX_BYTES: "${BOTAI_DIAGNOSTICS_MAX_BYTES:-10485760}"
    BOTAI_DIAGNOSTICS_BACKUP_COUNT: "${BOTAI_DIAGNOSTICS_BACKUP_COUNT:-2}"
    BOTAI_RESEARCH_SLICE_SECONDS: "${BOTAI_RESEARCH_SLICE_SECONDS:-90}"
    BOTAI_RESEARCH_SLICE_STEPS: "${BOTAI_RESEARCH_SLICE_STEPS:-10}"
    BOTAI_RESEARCH_MAX_SECONDS: "${BOTAI_RESEARCH_MAX_SECONDS:-1800}"
    BOTAI_RESEARCH_MAX_TOKENS: "${BOTAI_RESEARCH_MAX_TOKENS:-1500000}"
    BOTAI_RESEARCH_MAX_STEPS: "${BOTAI_RESEARCH_MAX_STEPS:-100}"
    BOTAI_RESEARCH_MAX_REQUESTS: "${BOTAI_RESEARCH_MAX_REQUESTS:-2000}"
    BOTAI_RESEARCH_CHECKPOINT_TTL_HOURS: "${BOTAI_RESEARCH_CHECKPOINT_TTL_HOURS:-24}"
  volumes: [diagdata:/var/log/botai/diagnostics]
  restart: unless-stopped
  networks: [botai]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: botai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: botai
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botai"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [botai]
    mem_limit: 768m

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    profiles: [tools]

  api:
    <<: *app
    env_file: [/srv/botai/app.secrets, /srv/botai/speech.secrets]
    environment:
      <<: *app-env
      BOTAI_DIAGNOSTICS_SERVICE: api
    # The framework spools an upload above a megabyte (attachments, dictation) to /tmp: into memory
    # (counted in mem_limit), never onto the disk layer of the container.
    tmpfs:
      - /tmp:size=128m,mode=1777
    ports: ["127.0.0.1:18090:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 768m

  worker:
    <<: *app
    command: ["python", "-m", "botai.worker"]
    # Worker drains for 20 seconds before returning its claims to the queue.
    stop_grace_period: 45s
    environment:
      <<: *app-env
      BOTAI_DIAGNOSTICS_SERVICE: worker
      BOTAI_BROWSER_TMPDIR: /tmp/chromium  # browser profiles live in tmpfs, never on disk
    tmpfs:
      - /tmp:size=512m,mode=1777
    depends_on:
      postgres: { condition: service_healthy }
      proxy: { condition: service_started }
    shm_size: 1gb
    mem_limit: 2g

  proxy:
    <<: *app
    environment:
      <<: *app-env
      BOTAI_DIAGNOSTICS_SERVICE: proxy
    command: ["python", "-m", "botai.browser.proxy", "--listen", "0.0.0.0:3128"]
    mem_limit: 256m

volumes:
  pgdata: {}
  diagdata: {}

networks:
  botai: {}
