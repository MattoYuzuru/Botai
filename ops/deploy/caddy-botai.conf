# Справочный блок Caddy для `botai.mnema.app` (production на mnema).
#
# Это не конфиг, который применяется автоматически: Caddy правится один раз вручную, как
# описано в docs/plan/deployment.md («Caddy: access-лог, таймауты, алерты»). Файл хранит
# точный вид блока, чтобы его можно было воспроизвести, сравнить и откатить.
#
# Что здесь важно:
#   * access-лог в файл с ротацией: 499/5xx/WS-403 и длительности стримов считаются, а не гадаются
#     (инциденты 09 §4: 499/504 были недоказуемы при выключенном access-логе);
#   * query вырезается целиком (`?REDACTED`): в query бывают коды, токены и ключ-ссылки;
#   * Cookie/Authorization/Proxy-Authorization/Set-Cookie удаляются; Caddy и так пишет их
#     REDACTED по умолчанию, но явное удаление не зависит от глобального `log_credentials`;
#   * IP маскируется до /24 (IPv4) и /48 (IPv6): владелец остаётся различимым по сети, но
#     точный адрес в публичный лог не попадает;
#   * `dial_timeout 2s` и `response_header_timeout 30s`: зависший upstream даёт 504 за внятное
#     время, а не держит соединение минутами.
#
# Применение (на mnema, от sudo):
#   `cp -a /etc/caddy/Caddyfile /etc/caddy/Caddyfile.bak-$(date +%Y%m%d-%H%M%S)`
#   вставить блок ниже вместо старого `botai.mnema.app { … }`;
#   `caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null` (синтаксис);
#   `sudo -u caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile`
#     — именно от пользователя caddy: validate от root создаёт файл лога root:root, после
#     чего reload падает с `permission denied` (проверено 2026-10-31);
#   `systemctl reload caddy` (reload, не restart: живые соединения Mnema не рвутся).
#
# Откат: вернуть `Caddyfile` из бэкапа и `systemctl reload caddy`; файл лога можно удалить.

botai.mnema.app {
	encode zstd gzip
	log {
		output file /var/log/caddy/botai-access.log {
			roll_size 20MiB
			roll_keep 10
			roll_keep_for 720h
		}
		format filter {
			request>uri regexp \?.* ?REDACTED
			request>remote_ip ip_mask 24 48
			request>client_ip ip_mask 24 48
			request>headers>Cookie delete
			request>headers>Authorization delete
			request>headers>Proxy-Authorization delete
			request>headers>X-Api-Key delete
			request>headers>X-Forwarded-For delete
			resp_headers>Set-Cookie delete
		}
	}
	reverse_proxy 127.0.0.1:18090 {
		flush_interval -1
		transport http {
			dial_timeout 2s
			response_header_timeout 30s
		}
	}
}
