[project]
name = "botai"
version = "0.1.0"
description = "BotAI — учебный хаб студента: бэкенд"
requires-python = ">=3.13,<3.15"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "httpx>=0.28",
  "tenacity>=9.0",
  "cryptography>=44",
  "python-ulid>=3.0",
  "argon2-cffi>=23.1",
  "sse-starlette>=2.1",
  "jsonschema>=4.23",
  "selectolax>=0.3.27",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "icalendar>=6.1",
  "playwright==1.63.0",  # matches Chromium 1243; bump together with the browser build
  "python-multipart>=0.0.18",
  "email-validator>=2.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "pyright>=1.1.390",
  "datamodel-code-generator>=0.26",
  "respx>=0.21",
  "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botai"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["src/botai/contracts/_generated", "src/botai/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF", "PT", "TID"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Используйте botai.core.http (таймауты, ретраи, EgressProxy)."
"urllib.request".msg = "Используйте botai.core.http (таймауты, ретраи, EgressProxy)."

[tool.pyright]
include = ["src"]
exclude = ["src/botai/contracts/_generated", "src/botai/db/migrations"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
  "db: нужен Postgres (DATABASE_URL)",
  "browser: нужен Chromium Playwright",
  "live_llm: уровень L2, тратит деньги, только с BOTAI_LIVE_LLM=1",
]
